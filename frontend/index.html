<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101116" />
    <title>CineVerse | Platform Command</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div class="boot-screen"><span class="boot-mark">CV</span><strong>CineVerse Admin</strong><small>Starting secure portal…</small></div></div>
    <script>
      const showBootError = (message) => {
        const root = document.getElementById('root');
        if (root && !root.querySelector('.app-shell, .login-page')) {
          const detail = document.createElement('small');
          detail.textContent = String(message || 'Unknown browser error');
          root.replaceChildren(Object.assign(document.createElement('div'), { className: 'boot-screen boot-error', innerHTML: '<span class="boot-mark">!</span><strong>Portal startup failed</strong><button onclick="location.reload()">Reload portal</button>' }));
          root.querySelector('.boot-error').insertBefore(detail, root.querySelector('button'));
        }
      };
      window.addEventListener('error', (event) => showBootError(event.message));
      window.addEventListener('unhandledrejection', (event) => showBootError(event.reason?.message || event.reason));
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
